services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 4225
      POSTGRES_DB: chatbot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_fastapi
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: chatbot_db
      DB_POSTGRESDB_USER: admin
      DB_POSTGRESDB_PASSWORD: 4225
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Sao_Paulo
    depends_on:
      - postgres
    volumes:
      - n8n_data:/home/node/.n8n

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  python-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - ollama
      - redis
    volumes:
      - .:/app


  redis:
      image: redis:alpine
      ports:
        - "6379:6379"
      volumes:
        - redis-data:/data

volumes:
  postgres_data:
  n8n_data:
  ollama_data:
  redis-data: